name: M1 verification
on:
  push:
    branches: [feat/m1-playable-slice]
  pull_request:
    branches: [master]
    paths:
      - 'm1.html'
      - 'js/m1_game.js'
      - 'data/m1_contract.json'
      - 'docs/M1_IMPLEMENTATION_SPEC.md'
      - 'tests/m1*.test.mjs'
      - 'tests/fixtures/m1_goldens.json'
      - 'tools/m1*.mjs'
      - '.github/workflows/m1.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M1 regression and rules contract
        run: node --test tests/m1*.test.mjs
      - name: Emit fixed-seed golden baseline for reviewer
        run: node tools/m1_goldens.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: M1 real DOM eight-school three-battle interaction
        run: node tools/m1_browser_smoke.mjs
      - name: Preserve browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-browser-evidence
          path: artifacts/m1-browser/
          if-no-files-found: ignore
