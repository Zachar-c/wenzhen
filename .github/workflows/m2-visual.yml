name: M2 ink specimen visual acceptance
on:
  pull_request:
    paths:
      - 'm2.html'
      - 'css/m2_ink.css'
      - 'js/m2_game.js'
      - 'js/m2_visual_pass.js'
      - 'assets/visual/**'
      - 'tools/m2_ink_browser.mjs'
      - '.github/workflows/m2-visual.yml'
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node tools/m2_ink_browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-ink-browser-evidence
          path: output/ink-specimen-20261014/
          if-no-files-found: warn
