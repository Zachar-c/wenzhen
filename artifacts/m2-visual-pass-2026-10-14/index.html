<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M2 visual pass · 浏览器验收</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:#211a2d;color:#eddfec}*{box-sizing:border-box}body{max-width:1680px;margin:auto;padding:32px}header{display:flex;align-items:start;justify-content:space-between;gap:20px}h1{margin:0;font-size:28px}p{color:#bdaac6;margin:8px 0 18px}a{color:#e5be91}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,select{padding:8px 14px;border:1px solid #675372;border-radius:18px;background:#382a46;color:#e9d8ec;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#9172ad;color:#fff1da}button:disabled{opacity:.3;cursor:default}:focus-visible{outline:2px solid #edc78f;outline-offset:3px}.tools{display:flex;align-items:center;gap:14px;margin:14px 0}.tools input{width:240px;accent-color:#bd94d3}.stage{position:relative;width:100%;aspect-ratio:16/9;border:1px solid #725a85;border-radius:16px;overflow:hidden;background:#302438}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage .after{z-index:2}.divider{position:absolute;top:0;bottom:0;left:50%;z-index:3;width:2px;background:#fff3d5;pointer-events:none}.caption{display:flex;justify-content:space-between;gap:18px;margin:12px 0;color:#cfbbda}small{font-size:13px;color:#ad96bd}.tag{display:inline-block;padding:3px 12px;border:1px solid #705678;border-radius:15px;color:#dec3e4;font-size:13px}[hidden]{display:none!important}
</style>
<header><div><span class="tag">WORK · 1920×1080 · 2026-10-14</span><h1>M2 visual pass</h1><p>真实浏览器截图与本轮前后对照。布局、可读性和状态反馈已修正；统一角色、蛊虫卡面与技能演出仍有素材缺口。</p></div><a href="../../docs/handoffs/M2_VISUAL_PASS_1080P_2026-10-14.md">打开 handoff</a></header>
<nav id="states" aria-label="查看状态"></nav><div class="tools"><button id="compare" aria-pressed="false">前后对照</button><label id="slider-label" hidden>分界 <input id="split" type="range" min="0" max="100" value="50" aria-label="前后截图分界"></label><a id="original" href="after/02-prep.png" target="_blank">打开原尺寸</a><a href="after/acceptance.json">验收证据</a></div>
<div class="stage"><img class="before" id="before" alt="本轮开始时的浏览器画面" hidden><img class="after" id="after" src="after/02-prep.png" alt="整备页最新浏览器画面"><i class="divider" id="divider" hidden></i></div><div class="caption"><b id="caption">整备</b><small id="note">全部截图由 Chromium 捕获；原图均为 1920×1080 PNG。</small></div>
<script>
const states=[['道途选择','01-onboarding.png'],['整备','02-prep.png','prep.png'],['悬停','03-hover.png','hover.png'],['物品查询','04-inspect.png','inspect.png'],['追猎','05-hunt-drawer.png'],['合炼','05b-refine-drawer.png'],['满蛊仓 / 满阵','06-full-inventory.png',null,'压力夹具：独立测试存档 12 只蛊、5 只出战。'],['战斗','07-fight.png','fight.png'],['暂停','08-paused.png'],['公开意图 / 护盾','09-active-intent.png'],['敌人查询','10-enemy-inspect.png'],['战报','11-battle-log.png'],['胜利收获','12-spoils.png'],['满仓收获','13-full-spoils.png',null,'压力夹具：满仓交换选择器。'],['未公开变招','14-hidden-feint-inspect.png',null,'真实引擎步进至 tick 15；没有覆写公开标志。'],['六战结算','15-run-result.png']];
let selected=1,comparing=false;const $=id=>document.getElementById(id);
function draw(){const [name,file,before,note]=states[selected];$('after').src='after/'+file;$('after').alt=name+'最新浏览器画面';$('before').src=before?'before/'+before:'';$('before').hidden=!comparing;$('compare').disabled=!before;$('compare').setAttribute('aria-pressed',String(comparing));$('slider-label').hidden=!comparing;$('divider').hidden=!comparing;$('original').href='after/'+file;$('caption').textContent=name;$('note').textContent=note||'全部截图由 Chromium 捕获；原图均为 1920×1080 PNG。';document.querySelectorAll('nav button').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===selected)));split()}
function split(){const position=$('split').value;$('after').style.clipPath=comparing?'inset(0 '+(100-position)+'% 0 0)':'none';$('divider').style.left=position+'%'}
states.forEach(([name],i)=>{const button=document.createElement('button');button.textContent=name;button.onclick=()=>{selected=i;if(!states[i][2])comparing=false;draw()};$('states').append(button)});$('compare').onclick=()=>{comparing=!comparing;draw()};$('split').oninput=split;draw();
</script></html>
